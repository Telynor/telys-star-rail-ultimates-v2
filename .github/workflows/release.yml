name: Build Foundry Release

on:
  push:
    branches: [main, light-cones-preview, 'codex/audit-*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read manifest version
        id: version
        shell: bash
        run: |
          manifest_version="$(jq -r '.version' module.json)"
          echo "version=$manifest_version" >> "$GITHUB_OUTPUT"
          echo "tag=v$manifest_version" >> "$GITHUB_OUTPUT"

      - name: Check out tested Memosprites integration
        uses: actions/checkout@v4
        with:
          repository: Telynor/telys-memosprites
          ref: 1fd9b59264a2e75d24038a330792d06f8cb62db1
          path: .test-memosprites
          persist-credentials: false

      - name: Check out D&D5e 6 summon lifecycle and v14 placement
        uses: actions/checkout@v4
        with:
          repository: foundryvtt/dnd5e
          ref: release-6.0.6
          path: .test-dnd5e6
          persist-credentials: false

      - name: Check out native D&D5e placement for integration tests
        uses: actions/checkout@v4
        with:
          repository: foundryvtt/dnd5e
          ref: release-5.3.3
          path: .test-dnd5e
          persist-credentials: false

      - name: Build Star Rail Materials compendium
        run: |
          npm install --no-audit --no-fund
          npm run build:materials
          node tools/fetch-light-cone-art.mjs
          npm run build:light-cones
          DND5E_SOURCE_ROOT=.test-dnd5e DND5E_V6_SOURCE_ROOT=.test-dnd5e6 MEMOSPRITES_SOURCE_ROOT=.test-memosprites npm test

      - name: Check out tested Planar sheet integration
        uses: actions/checkout@v4
        with:
          repository: Telynor/telys-planar-ornaments
          ref: 1e88edd7366d1ea4427bf2563e067b230ba6bf19
          path: .test-planar
          persist-credentials: false

      - name: Install Chromium verification dependencies
        timeout-minutes: 10
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund playwright jsdom
          npx playwright install --with-deps chromium --only-shell

      - name: Test summon and Party Setup application controls
        timeout-minutes: 3
        run: |
          MEMOSPRITES_SOURCE_ROOT=.test-memosprites node tests/summon-settings-dom.cjs
          node tests/party-setup-dom.cjs
          node tests/path-changing-dom.cjs
          node tests/sheet-compat-dom.cjs

      - name: Test shared Party Setup with two Chromium clients
        timeout-minutes: 5
        run: node tests/party-setup-ui.cjs

      - name: Test shared inventory Path changes with two Chromium clients
        timeout-minutes: 5
        run: node tests/path-changing-ui.cjs

      - name: Test existing module features in Chromium
        timeout-minutes: 10
        run: |
          node tests/alternate-orb-ui.cjs
          node tests/ability-score-ui.cjs
          DND5E_SOURCE_ROOT=.test-dnd5e node tests/summoning-ui.cjs
          node tests/help-ui.cjs
          node tests/multitype-ui.cjs
          PLANAR_SOURCE_ROOT=.test-planar node tests/npc-controls-ui.cjs
          DND5E_SOURCE_ROOT=.test-dnd5e MEMOSPRITES_SOURCE_ROOT=.test-memosprites node tests/memosprite-summoning-ui.cjs

      - name: Save orb designer screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alternate-orb-designer-preview
          path: |
            orb-designer-smoke.png
            ultimate-sequence-smoke.png
            character-settings-search-smoke.png
            character-settings-menu-smoke.png
            enhanced-standard-selector-smoke.png
            enhanced-alternate-selector-smoke.png
            ability-scores-wide-smoke.png
            ability-scores-compact-smoke.png
            ability-scores-failure.png
            light-cone-frame-smoke.png
            summoning-settings-smoke.png
            summoning-choice-smoke.png
            summoning-placement-smoke.png
            summoning-failure.png
            help-manual-smoke.png
            help-search-smoke.png
            help-tooltip-smoke.png
            help-compact-smoke.png
            help-failure.png
            multitype-settings-smoke.png
            multitype-attacks-smoke.png
            multitype-element-change-smoke.png
            multitype-failure.png
            npc-controls-smoke.png
            npc-controls-compact-smoke.png
            npc-initiative-smoke.png
            npc-controls-failure.png
            memosprite-summoning-failure.png
            party-setup-shared.png
            party-setup-artwork.png
            party-setup-compact.png
            party-setup-trial.png
            party-setup-gm-failure.png
            party-setup-player-failure.png
            path-changing-importer.png
            path-changing-selector.png
            path-changing-compact.png
            path-changing-gm-failure.png
            path-changing-owner-failure.png
          if-no-files-found: ignore

      - name: Create Foundry module ZIP
        shell: bash
        run: |
          zip -r "telys-star-rail-ultimates-v${{ steps.version.outputs.version }}.zip" \
            module.json README.md LICENSE assets data docs packs lang scripts styles templates

      - name: Create or update GitHub release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/light-cones-preview'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_flags=()
          if [[ "$GITHUB_REF_NAME" == "light-cones-preview" ]]; then release_flags+=(--prerelease); fi
          tag="${{ steps.version.outputs.tag }}"
          asset="telys-star-rail-ultimates-v${{ steps.version.outputs.version }}.zip"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" module.json --clobber
          else
            gh release create "$tag" "$asset" module.json --title "$tag" --generate-notes --target "$GITHUB_SHA" "${release_flags[@]}"
          fi
