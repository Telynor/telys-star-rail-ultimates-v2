<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="510" viewBox="0 0 1000 510" role="img"><title>Memosprite HUD and configuration</title><desc>Linked source, battle-map token and on-screen HUD are separate pieces.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#aab9c8"/></marker></defs><rect width="1000" height="510" fill="#111c29"/><text x="34" y="43" fill="#e4c487" font-size="26" font-weight="700" font-family="Arial,sans-serif">Memosprite HUD and configuration</text><text x="34" y="72" fill="#aab9c8" font-size="15" font-weight="400" font-family="Arial,sans-serif">Linked source, battle-map token and on-screen HUD are separate pieces.</text><rect x="50" y="123" width="425" height="260" rx="15" fill="#1d2d3d" stroke="#52657a"/><circle cx="168" cy="235" r="70" fill="#34566b" stroke="#8bd6d4" stroke-width="7"/><text x="132" y="241" fill="#e9edf1" font-size="17" font-weight="400" font-family="Arial,sans-serif">Portrait</text><text x="107" y="336" fill="#e4c487" font-size="19" font-weight="700" font-family="Arial,sans-serif">HP 18 / 24</text><circle cx="301" cy="195" r="9" fill="#8bd6d4"/><circle cx="345" cy="195" r="9" fill="#8bd6d4"/><circle cx="389" cy="195" r="9" fill="#52657a"/><text x="285" y="234" fill="#aab9c8" font-size="15" font-weight="400" font-family="Arial,sans-serif">Resource 2 / 3</text><rect x="280" y="268" width="161" height="51" rx="6" fill="#284d5a" stroke="#8bd6d4"/><text x="304" y="299" fill="#e9edf1" font-size="15" font-weight="400" font-family="Arial,sans-serif">Ability button</text><rect x="524" y="110" width="442" height="143" rx="12" fill="#1d2d3d" stroke="#8bd6d4"/><text x="542" y="141" fill="#8bd6d4" font-size="17" font-weight="700" font-family="Arial,sans-serif">Configuration</text><text x="542" y="171" fill="#e9edf1" font-size="14" font-weight="400" font-family="Arial,sans-serif">Link an Actor (live HP) or Item</text><text x="542" y="195" fill="#e9edf1" font-size="14" font-weight="400" font-family="Arial,sans-serif">Set resource style and ability list</text><text x="542" y="219" fill="#e9edf1" font-size="14" font-weight="400" font-family="Arial,sans-serif">Summon / restore / visibility controls</text><rect x="524" y="287" width="442" height="143" rx="12" fill="#1d2d3d" stroke="#8bd6d4"/><text x="542" y="318" fill="#8bd6d4" font-size="17" font-weight="700" font-family="Arial,sans-serif">HUD layout</text><text x="542" y="348" fill="#e9edf1" font-size="14" font-weight="400" font-family="Arial,sans-serif">Frame = whole companion HUD</text><text x="542" y="372" fill="#e9edf1" font-size="14" font-weight="400" font-family="Arial,sans-serif">Parts = portrait, HP, resource, abilities</text><text x="542" y="396" fill="#e9edf1" font-size="14" font-weight="400" font-family="Arial,sans-serif">Offsets / scales change the display</text><text x="50" y="466" fill="#aab9c8" font-size="14" font-weight="400" font-family="Arial,sans-serif">Illustrative layout: visibility switches, offsets and installed addon version can differ.</text></svg>