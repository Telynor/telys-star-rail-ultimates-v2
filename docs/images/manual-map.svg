<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img"><title>Find the right control, then the right guide</title><desc>The manual and hover help share one field reference.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#aab9c8"/></marker></defs><rect width="1000" height="520" fill="#111c29"/><text x="34" y="43" fill="#e4c487" font-size="26" font-weight="700" font-family="Arial,sans-serif">Find the right control, then the right guide</text><text x="34" y="72" fill="#aab9c8" font-size="15" font-weight="400" font-family="Arial,sans-serif">The manual and hover help share one field reference.</text><rect x="34" y="108" width="282" height="145" rx="12" fill="#1d2d3d" stroke="#8bd6d4"/><text x="52" y="139" fill="#8bd6d4" font-size="17" font-weight="700" font-family="Arial,sans-serif">01 · Character setup</text><text x="52" y="169" fill="#e9edf1" font-size="14" font-weight="400" font-family="Arial,sans-serif">HSR Settings → grouped menus</text><text x="52" y="193" fill="#e9edf1" font-size="14" font-weight="400" font-family="Arial,sans-serif">Energy, abilities, alternate orbs</text><text x="52" y="217" fill="#e9edf1" font-size="14" font-weight="400" font-family="Arial,sans-serif">Enhanced form and artwork</text><rect x="359" y="108" width="282" height="145" rx="12" fill="#1d2d3d" stroke="#8bd6d4"/><text x="377" y="139" fill="#8bd6d4" font-size="17" font-weight="700" font-family="Arial,sans-serif">02 · Encounter controls</text><text x="377" y="169" fill="#e9edf1" font-size="14" font-weight="400" font-family="Arial,sans-serif">GM Panel → live resources</text><text x="377" y="193" fill="#e9edf1" font-size="14" font-weight="400" font-family="Arial,sans-serif">DM Combat → encounter tabs</text><text x="377" y="217" fill="#e9edf1" font-size="14" font-weight="400" font-family="Arial,sans-serif">Memosprite → companion tools</text><rect x="684" y="108" width="282" height="145" rx="12" fill="#1d2d3d" stroke="#8bd6d4"/><text x="702" y="139" fill="#8bd6d4" font-size="17" font-weight="700" font-family="Arial,sans-serif">03 · Learn in context</text><text x="702" y="169" fill="#e9edf1" font-size="14" font-weight="400" font-family="Arial,sans-serif">Hover a field or focus it</text><text x="702" y="193" fill="#e9edf1" font-size="14" font-weight="400" font-family="Arial,sans-serif">? Help → the relevant guide</text><text x="702" y="217" fill="#e9edf1" font-size="14" font-weight="400" font-family="Arial,sans-serif">Rocket → Help Documentation</text><path d="M322 182 L349 182" stroke="#aab9c8" stroke-width="2" fill="none" marker-end="url(#arr)"/><path d="M647 182 L674 182" stroke="#aab9c8" stroke-width="2" fill="none" marker-end="url(#arr)"/><rect x="34" y="291" width="932" height="158" rx="12" fill="#1d2d3d" stroke="#e4c487"/><text x="52" y="322" fill="#e4c487" font-size="17" font-weight="700" font-family="Arial,sans-serif">Find an answer</text><text x="52" y="352" fill="#e9edf1" font-size="14" font-weight="400" font-family="Arial,sans-serif">Search guides, fields and controls: alt ult · HP cost · pet range · art</text><text x="52" y="376" fill="#e9edf1" font-size="14" font-weight="400" font-family="Arial,sans-serif">Contents: setup → abilities → combat → equipment → campaign tools.</text><text x="52" y="400" fill="#e9edf1" font-size="14" font-weight="400" font-family="Arial,sans-serif">A–Z Index and search results jump directly to each field’s explanation.</text></svg>