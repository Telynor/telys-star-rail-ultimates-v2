<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img"><title>Two ways to charge an Ultimate</title><desc>Readiness follows the active form’s configured charge system.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#aab9c8"/></marker></defs><rect width="1000" height="470" fill="#111c29"/><text x="34" y="43" fill="#e4c487" font-size="26" font-weight="700" font-family="Arial,sans-serif">Two ways to charge an Ultimate</text><text x="34" y="72" fill="#aab9c8" font-size="15" font-weight="400" font-family="Arial,sans-serif">Readiness follows the active form’s configured charge system.</text><rect x="34" y="115" width="442" height="157" rx="12" fill="#1d2d3d" stroke="#8bd6d4"/><text x="52" y="146" fill="#8bd6d4" font-size="17" font-weight="700" font-family="Arial,sans-serif">Standard Ultimate</text><text x="52" y="176" fill="#e9edf1" font-size="14" font-weight="400" font-family="Arial,sans-serif">Attacks / being hit / configured gains</text><text x="52" y="200" fill="#e9edf1" font-size="14" font-weight="400" font-family="Arial,sans-serif">→ Energy pool reaches Maximum Energy</text><text x="52" y="224" fill="#e9edf1" font-size="14" font-weight="400" font-family="Arial,sans-serif">→ Ultimate becomes available</text><text x="52" y="248" fill="#e9edf1" font-size="14" font-weight="400" font-family="Arial,sans-serif">→ Casting consumes charge</text><rect x="524" y="115" width="442" height="157" rx="12" fill="#1d2d3d" stroke="#8bd6d4"/><text x="542" y="146" fill="#8bd6d4" font-size="17" font-weight="700" font-family="Arial,sans-serif">Alternate Ultimate</text><text x="542" y="176" fill="#e9edf1" font-size="14" font-weight="400" font-family="Arial,sans-serif">GM checks icons OR raises circular count</text><text x="542" y="200" fill="#e9edf1" font-size="14" font-weight="400" font-family="Arial,sans-serif">→ All components are active</text><text x="542" y="224" fill="#e9edf1" font-size="14" font-weight="400" font-family="Arial,sans-serif">→ Ultimate becomes available</text><text x="542" y="248" fill="#e9edf1" font-size="14" font-weight="400" font-family="Arial,sans-serif">→ Casting resets alternate progress</text><rect x="34" y="312" width="932" height="111" rx="12" fill="#1d2d3d" stroke="#e4c487"/><text x="52" y="343" fill="#e4c487" font-size="17" font-weight="700" font-family="Arial,sans-serif">The active form chooses the system</text><text x="52" y="373" fill="#e9edf1" font-size="14" font-weight="400" font-family="Arial,sans-serif">Regular and enhanced forms can have independent alternate designs and progress.</text><text x="52" y="397" fill="#e9edf1" font-size="14" font-weight="400" font-family="Arial,sans-serif">Positive standard Energy gains are blocked while the active form uses alternate charge.</text></svg>