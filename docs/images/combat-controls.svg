<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img"><title>Read the DM Combat panel</title><desc>Tabs group encounter controls; the footer stays available below them.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#aab9c8"/></marker></defs><rect width="1000" height="500" fill="#111c29"/><text x="34" y="43" fill="#e4c487" font-size="26" font-weight="700" font-family="Arial,sans-serif">Read the DM Combat panel</text><text x="34" y="72" fill="#aab9c8" font-size="15" font-weight="400" font-family="Arial,sans-serif">Tabs group encounter controls; the footer stays available below them.</text><rect x="34" y="110" width="442" height="143" rx="12" fill="#1d2d3d" stroke="#8bd6d4"/><text x="52" y="141" fill="#8bd6d4" font-size="17" font-weight="700" font-family="Arial,sans-serif">Encounter tabs</text><text x="52" y="171" fill="#e9edf1" font-size="14" font-weight="400" font-family="Arial,sans-serif">Alt Ultimates · component charge</text><text x="52" y="195" fill="#e9edf1" font-size="14" font-weight="400" font-family="Arial,sans-serif">Talents · view / change points</text><text x="52" y="219" fill="#e9edf1" font-size="14" font-weight="400" font-family="Arial,sans-serif">Weaknesses · temporary Element overrides</text><rect x="524" y="110" width="442" height="143" rx="12" fill="#1d2d3d" stroke="#8bd6d4"/><text x="542" y="141" fill="#8bd6d4" font-size="17" font-weight="700" font-family="Arial,sans-serif">More encounter tabs</text><text x="542" y="171" fill="#e9edf1" font-size="14" font-weight="400" font-family="Arial,sans-serif">Stances · Normal / Enhanced form</text><text x="542" y="195" fill="#e9edf1" font-size="14" font-weight="400" font-family="Arial,sans-serif">DoT · timed damage and conditions</text><text x="542" y="219" fill="#e9edf1" font-size="14" font-weight="400" font-family="Arial,sans-serif">Phases · multi-phase boss control</text><rect x="34" y="294" width="932" height="155" rx="12" fill="#1d2d3d" stroke="#e4c487"/><text x="52" y="325" fill="#e4c487" font-size="17" font-weight="700" font-family="Arial,sans-serif">Footer controls</text><text x="52" y="355" fill="#e9edf1" font-size="14" font-weight="400" font-family="Arial,sans-serif">Adjusted PC Stats · inspect values     |     Punchline / Skill Points − and + · live totals</text><text x="52" y="379" fill="#e9edf1" font-size="14" font-weight="400" font-family="Arial,sans-serif">Previous / Next Turn · initiative      |     Action Advance · insert an extra turn</text><text x="52" y="403" fill="#e9edf1" font-size="14" font-weight="400" font-family="Arial,sans-serif">End Combat · finish the encounter; this is a live action, not a preview.</text></svg>