<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="465" viewBox="0 0 1000 465" role="img"><title>Ultimate turns and returning to combat</title><desc>Orbs, HUD buttons and supported requests use the ordinary activation path.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#aab9c8"/></marker></defs><rect width="1000" height="465" fill="#111c29"/><text x="34" y="43" fill="#e4c487" font-size="26" font-weight="700" font-family="Arial,sans-serif">Ultimate turns and returning to combat</text><text x="34" y="72" fill="#aab9c8" font-size="15" font-weight="400" font-family="Arial,sans-serif">Orbs, HUD buttons and supported requests use the ordinary activation path.</text><rect x="34" y="115" width="280" height="122" rx="12" fill="#1d2d3d" stroke="#8bd6d4"/><text x="52" y="146" fill="#8bd6d4" font-size="17" font-weight="700" font-family="Arial,sans-serif">Request Ultimate</text><text x="52" y="176" fill="#e9edf1" font-size="14" font-weight="400" font-family="Arial,sans-serif">Check owner and readiness</text><text x="52" y="200" fill="#e9edf1" font-size="14" font-weight="400" font-family="Arial,sans-serif">Plan creatures, when enabled</text><path d="M326 176 L360 176" stroke="#aab9c8" stroke-width="2" fill="none" marker-end="url(#arr)"/><rect x="374" y="115" width="280" height="122" rx="12" fill="#1d2d3d" stroke="#8bd6d4"/><text x="392" y="146" fill="#8bd6d4" font-size="17" font-weight="700" font-family="Arial,sans-serif">Insert / interrupt turn</text><text x="392" y="176" fill="#e9edf1" font-size="14" font-weight="400" font-family="Arial,sans-serif">Show splash and ability text</text><text x="392" y="200" fill="#e9edf1" font-size="14" font-weight="400" font-family="Arial,sans-serif">Run the saved Ultimate code</text><path d="M666 176 L700 176" stroke="#aab9c8" stroke-width="2" fill="none" marker-end="url(#arr)"/><rect x="714" y="115" width="252" height="122" rx="12" fill="#1d2d3d" stroke="#8bd6d4"/><text x="732" y="146" fill="#8bd6d4" font-size="17" font-weight="700" font-family="Arial,sans-serif">Finish Ultimate turn</text><text x="732" y="176" fill="#e9edf1" font-size="14" font-weight="400" font-family="Arial,sans-serif">Use the completion flow</text><text x="732" y="200" fill="#e9edf1" font-size="14" font-weight="400" font-family="Arial,sans-serif">Resume the interrupted turn</text><rect x="34" y="292" width="932" height="124" rx="12" fill="#1d2d3d" stroke="#e4c487"/><text x="52" y="323" fill="#e4c487" font-size="17" font-weight="700" font-family="Arial,sans-serif">If a queued creature placement is blocked</text><text x="52" y="353" fill="#e9edf1" font-size="14" font-weight="400" font-family="Arial,sans-serif">The scene is revalidated when the Ultimate turn begins; reposition when needed.</text><text x="52" y="377" fill="#e9edf1" font-size="14" font-weight="400" font-family="Arial,sans-serif">A blocked or cancelled queued summon restores reserved charge and continues initiative.</text></svg>