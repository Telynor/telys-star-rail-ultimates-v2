<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="t d"><title id="t">Multitype: two ways to choose an attack Element</title><desc id="d">Type Changer edits the live Actor Element. Multitype attacks uses an activity override, then an Item override, then the Actor Element. Both handlers compare the resulting Element with target weaknesses.</desc><rect width="1100" height="620" rx="20" fill="#101a28"/><g font-family="Arial,sans-serif" fill="#edf2f9"><text x="40" y="54" font-size="28" font-weight="700">Multitype? — choose one mode per Actor</text><text x="40" y="87" fill="#b9c9dc" font-size="17">PCs · NPCs · summoned creatures · linked and unlinked token Actors</text><rect x="40" y="120" width="490" height="360" rx="14" fill="#1a2c42" stroke="#4d749c"/><rect x="570" y="120" width="490" height="360" rx="14" fill="#1a2c42" stroke="#4d749c"/><text x="66" y="160" font-size="23" font-weight="700">Type Changer</text><text x="66" y="191" fill="#b9c9dc" font-size="17">Mode switch ON</text><text x="66" y="234" font-size="18">GM changes this Actor’s live Element:</text><rect x="66" y="257" width="148" height="62" rx="8" fill="#7c332e"/><text x="113" y="295" font-size="22">Fire</text><path d="M232 288h58m-10-9 10 9-10 9" fill="none" stroke="#dbe9f9" stroke-width="3"/><rect x="307" y="257" width="184" height="62" rx="8" fill="#285d7c"/><text x="383" y="295" font-size="22">Ice</text><text x="66" y="365" font-size="18">Next attacks use Ice.</text><text x="66" y="398" font-size="17" fill="#b9c9dc">Saved Item overrides stay stored.</text><text x="66" y="428" font-size="17" fill="#b9c9dc">Earlier rolls keep their captured Element.</text><text x="596" y="160" font-size="23" font-weight="700">Multitype attacks</text><text x="596" y="191" fill="#b9c9dc" font-size="17">Mode switch OFF</text><text x="596" y="234" font-size="18">Use the first assigned Element:</text><g font-size="18"><rect x="596" y="253" width="438" height="48" rx="8" fill="#5d406f"/><text x="616" y="284">1. Activity override: Lightning</text><rect x="596" y="315" width="438" height="48" rx="8" fill="#285d7c"/><text x="616" y="346">2. Item override: Ice</text><rect x="596" y="377" width="438" height="48" rx="8" fill="#7c332e"/><text x="616" y="408">3. Actor default: Fire</text></g><text x="596" y="454" font-size="16" fill="#b9c9dc">Blank choices inherit the next level.</text><rect x="40" y="512" width="1020" height="72" rx="12" fill="#243f44" stroke="#5f9c8f"/><text x="62" y="542" font-size="19" font-weight="700">Same resolution in standard attacks and MidiQOL</text><text x="62" y="570" font-size="17">Captured attack Element + matching effective weakness → ordinary Toughness reduction</text></g></svg>
